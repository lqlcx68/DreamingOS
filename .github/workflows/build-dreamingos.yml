name: Build DreamingOS x86_64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 20480   # 关键修改：为系统盘预留 20GB 空间
          swap-size-mb: 4096      # 适当增加交换空间
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true' # 编译前清理不必要的 Docker 镜像

      - name: Clean up unnecessary files
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean

      - name: Checkout DreamingOS
        uses: actions/checkout@v4
        with:
          repository: Lester0504/DreamingOS
          ref: dev
          path: DreamingOS

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            rsync unzip zlib1g-dev file wget subversion swig time xsltproc \
            libelf-dev qemu-utils ccache

      - name: Update feeds
        working-directory: DreamingOS
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure x86_64 target
        working-directory: DreamingOS
        run: |
          make defconfig || true

      - name: Download source packages
        working-directory: DreamingOS
        run: make download -j8

      - name: Build firmware
        working-directory: DreamingOS
        run: make -j$(nproc) V=s

      - name: Collect firmware files
        run: |
          mkdir -p output
          find DreamingOS/bin/targets/x86/64/ -maxdepth 1 -type f \
            \( -name "*.img" -o -name "*.img.gz" -o -name "*.tar.gz" \) \
            -exec cp {} output/ \;
          ls -lh output/

      - name: Upload firmware as artifact
        uses: actions/upload-artifact@v4
        with:
          name: DreamingOS-x86_64-firmware
          path: output/
          retention-days: 30
